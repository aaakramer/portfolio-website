<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vostro Lab Server</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-width: 560px;
            width: 100%;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        h1 {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 600;
        }

        p {
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .spec-list {
            list-style: none;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: grid;
            gap: 10px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .spec-label {
            color: var(--text-muted);
        }

        .spec-value {
            color: var(--accent);
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="header">
            <div class="status-dot"></div>
            <h1>Dell Vostro Web Node</h1>
        </div>
        <p>Debian server deployed from bare metal, configured via SSH, and actively serving HTTP traffic across the local network.</p>
        <ul class="spec-list">
            <li class="spec-item">
                <span class="spec-label">Host Hardware</span>
                <span class="spec-value">Dell Vostro 200</span>
            </li>
            <li class="spec-item">
                <span class="spec-label">Operating System</span>
                <span class="spec-value">Debian GNU/Linux</span>
            </li>
            <li class="spec-item">
                <span class="spec-label">Web Server</span>
                <span class="spec-value">nginx</span>
            </li>
            <li class="spec-item">
                <span class="spec-label">Primary Storage</span>
                <span class="spec-value">Solid State Drive (/dev/sdb)</span>
            </li>
        </ul>
    </main>
</body>
</html>
